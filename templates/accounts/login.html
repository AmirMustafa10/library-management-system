{% extends "base.html" %}

{% block title %}Log in | Library Management System{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <p class="auth-eyebrow">Member access</p>
        <h1>Log in</h1>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="auth-button">Log in</button>
        </form>

        <p class="auth-switch">
            Don't have an account? <a href="{% url 'accounts:signup' %}">Sign up</a>
        </p>
    </div>
</section>
{% endblock %}
