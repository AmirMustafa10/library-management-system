{% extends "base.html" %}

{% block title %}Sign up | Library Management System{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <p class="auth-eyebrow">Member access</p>
        <h1>Create an account</h1>

        <form method="post" class="auth-form" id="signUp">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="auth-button">Sign up</button>
        </form>

        <p class="auth-switch">
            Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
        </p>
    </div>
</section>
{% endblock %}
